<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=7" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <meta name="description" content="A webpage for a quiz app" />
    <meta name="keywords" content="Quiz, GK, General Knowledge" />
    <meta name="author" content="Arijeet Mondal" />
    <title>IIT JAM | CY</title>
    <link rel="stylesheet" href="/components/global.css" />
    <link rel="stylesheet" href="/components/mock.css">
  </head>
  <body>
    <div class="quiz-container">
      <h2 id="quiz-question">Question Tag</h2>

      <ul>
        <li>
          <input
            type="radio"
            class="answer"
            id="option-a"
            name="quiz-options"
          />
          <label for="optiona-a" id="text-option-a">Option A</label>
        </li>

        <li>
          <input
            type="radio"
            class="answer"
            id="option-b"
            name="quiz-options"
          />
          <label for="optiona-b" id="text-option-b">Option B</label>
        </li>

        <li>
          <input
            type="radio"
            class="answer"
            id="option-c"
            name="quiz-options"
          />
          <label for="optiona-c" id="text-option-c">Option C</label>
        </li>

        <li>
          <input
            type="radio"
            class="answer"
            id="option-d"
            name="quiz-options"
          />
          <label for="optiona-d" id="text-option-d">Option D</label>
        </li>
      </ul>

      <button id="submit">Submit</button>
    </div>
    <script src="/js/cy.js"></script>
  </body>
</html>
